<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- --inicio sesion -->
    <div class="container">
        <div class="container-form">
            <form class="sign-in">
                <h2>Iniciar sesión</h2>
                <div class="social-networks">
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-whatsapp"></ion-icon>
                </div>
                <span>use su correo y contraseña</span>
                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="Email">
                </div>

                <div class="container-input">
                    <ion-icon name="key-outline"></ion-icon>
                    <input type="password" placeholder="Contraseña">
                </div>
                <a href="#">¿Olvidaste tu constraseña?</a>
                <button class="button">INICIAR SESION</button>
            </form>
        </div>


<!-- --registrarse -->
        <div class="container-form">
            <form class="sign-up" id="form-validation" novalidate>
                <h2>Registrarse</h2>
                <div class="social-networks">
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-whatsapp"></ion-icon>
                </div>
                <span>use su correo electronico para registrarse</span>
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" id="nombre" placeholder="Nombre" required>
                </div>

                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" id="email" placeholder="Email" required>
                </div>

                <div class="container-input">
                    <ion-icon name="key-outline"></ion-icon>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <div class="button">
                    <input type="submit" value="Registrarse">
                </div>
            </form>
        </div>

<!-- transicion del formulario -->
        <div class="container-welcome">
            <div class="welcome-sign-up welcome">
                <h3>Bienvenido</h3>
                <p>ingrese sus datos</p>
                <button class="button" id="btn-sign-up">Registrarse</button>
            </div>

            <div class="welcome-sign-in welcome">
                <h3>Hola</h3>
                <p>Registrese con sus datos personales</p>
                <button class="button" id="btn-sign-in">Iniciar sesion</button>
            </div>
        </div>

    </div>

<!-- boton que permite mover el formulario -->
    <script src="/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
